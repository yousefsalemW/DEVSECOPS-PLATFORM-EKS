# =============================================================================
#  VProfile Helm values
#
#  IMPORTANT — the Service names in this chart are NOT free choices.
#  application.properties is baked into the app image at build time and points at
#  db01 / mc01 / rmq01 by hostname, and docker/web/nginx.conf proxies to app01.
#  Renaming a Service breaks the app with no error at deploy time.
# =============================================================================

# ECR registry, e.g. 450444046673.dkr.ecr.eu-west-3.amazonaws.com
# Passed by the pipeline: --set image.registry=... --set image.tag=...
image:
  registry: ""
  tag: ""
  pullPolicy: IfNotPresent

# Credentials the app image was built with. jdbc.password is compiled into the
# WAR's application.properties, so this value MUST match it until Vault lands
# and the properties are rendered at startup instead of at build time.
db:
  name: accounts

  # No password lives in this file. Pick ONE of the two below.
  #
  # Preferred — a Secret created outside the chart (by you now, by Vault later).
  # It must contain the key MYSQL_ROOT_PASSWORD, because the db container reads
  # it with envFrom and the MySQL entrypoint expects that exact name:
  #   kubectl -n vprofile create secret generic db01-credentials \
  #     --from-literal=MYSQL_ROOT_PASSWORD='<strong password>'
  existingSecret: ""

  # Escape hatch — pass at install time, never commit a value here:
  #   helm upgrade --install ... --set db.rootPassword="$DB_PASSWORD"
  # The chart then creates the Secret itself.
  rootPassword: ""

storage:
  className: gp3
  size: 8Gi

ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  # Tomcat sends 302 from / to /login, which an ALB health check reads as
  # unhealthy — so probe the page that actually returns 200.
  healthcheckPath: /login

app:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits:   { memory: 1536Mi }

web:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }

database:
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { memory: 1Gi }

memcached:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 192Mi }

rabbitmq:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }
