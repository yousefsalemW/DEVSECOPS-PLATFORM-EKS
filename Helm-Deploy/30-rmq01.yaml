apiVersion: v1
kind: Service
metadata:
  name: rmq01
  labels: {{- include "vprofile.labels" . | nindent 4 }}
spec:
  selector:
    app: rmq01
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmq01
  labels: {{- include "vprofile.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmq01
  template:
    metadata:
      labels:
        app: rmq01
        {{- include "vprofile.labels" . | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ include "vprofile.image" (dict "root" . "name" "vprofile-rmq") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5672
          # The app connects as guest/guest, which is the image default — so no
          # credentials are set here on purpose.
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 8
          resources: {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
