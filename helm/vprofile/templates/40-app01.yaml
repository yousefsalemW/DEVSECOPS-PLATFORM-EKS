apiVersion: v1
kind: Service
metadata:
  name: app01              # nginx.conf proxies to app01:8080 — do not rename
  labels: {{- include "vprofile.labels" . | nindent 4 }}
spec:
  selector:
    app: app01
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app01
  labels: {{- include "vprofile.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: app01
  template:
    metadata:
      labels:
        app: app01
        {{- include "vprofile.labels" . | nindent 8 }}
    spec:
      # Spring builds its Hibernate SessionFactory during context startup. If
      # MySQL is not accepting connections yet, the context fails and Tomcat
      # serves 404 for the life of the pod — a restart is the only cure. Waiting
      # here is cheaper than a CrashLoop that never actually crashes.
      initContainers:
        - name: wait-for-backends
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for svc in db01:3306 mc01:11211 rmq01:5672; do
                host=${svc%%:*}; port=${svc##*:}
                echo "waiting for ${host}:${port}"
                until nc -z "${host}" "${port}"; do sleep 3; done
                echo "  ${host}:${port} up"
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 32Mi }
          # The initContainer is a container too - busybox runs as root by
          # default, and a permissive init is a permissive pod.
          securityContext:
            {{- include "vprofile.containerSecurity" (dict "root" . "extra" .Values.securityContext.app) | nindent 12 }}
      containers:
        - name: tomcat
          image: {{ include "vprofile.image" (dict "root" . "name" "vprofile-app") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            # Overrides the password compiled into the WAR — no image rebuild.
            # Spring 5's <context:property-placeholder> builds a
            # PropertySourcesPlaceholderConfigurer whose localOverride defaults to
            # false, so the Environment is consulted BEFORE application.properties,
            # and SystemEnvironmentPropertySource maps JDBC_PASSWORD -> jdbc.password.
            # Verify once after the first deploy:
            #   kubectl -n vprofile exec deploy/app01 -- printenv JDBC_PASSWORD
            - name: JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vprofile.dbSecretName" . }}
                  key: MYSQL_ROOT_PASSWORD
            # Same override mechanism for the broker: RABBITMQ_USERNAME and
            # RABBITMQ_PASSWORD resolve ${rabbitmq.username} and
            # ${rabbitmq.password} in appconfig-rabbitmq.xml ahead of the
            # placeholders compiled into the WAR.
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vprofile.rmqSecretName" . }}
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vprofile.rmqSecretName" . }}
                  key: RABBITMQ_DEFAULT_PASS
          # /login is the first page that returns 200. / returns a 302 redirect,
          # which a probe with default success codes treats as a failure.
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 120
            periodSeconds: 20
          securityContext:
            {{- include "vprofile.containerSecurity" (dict "root" . "extra" .Values.securityContext.app) | nindent 12 }}
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
