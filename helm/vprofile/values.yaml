# =============================================================================
#  VProfile Helm values
#
#  IMPORTANT — the Service names in this chart are NOT free choices.
#  application.properties is baked into the app image at build time and points at
#  db01 / mc01 / rmq01 by hostname, and docker/web/nginx.conf proxies to app01.
#  Renaming a Service breaks the app with no error at deploy time.
# =============================================================================

# ECR registry, e.g. 450444046673.dkr.ecr.eu-west-3.amazonaws.com
# Passed by the pipeline: --set image.registry=... --set image.tag=...
image:
  registry: ""
  tag: ""
  pullPolicy: IfNotPresent

# Credentials the app image was built with. jdbc.password is compiled into the
# WAR's application.properties, so this value MUST match it until Vault lands
# and the properties are rendered at startup instead of at build time.
db:
  name: accounts

  # No password lives in this file. Pick ONE of the two below.
  #
  # Preferred — a Secret created outside the chart (by you now, by Vault later).
  # It must contain the key MYSQL_ROOT_PASSWORD, because the db container reads
  # it with envFrom and the MySQL entrypoint expects that exact name:
  #   kubectl -n vprofile create secret generic db01-credentials \
  #     --from-literal=MYSQL_ROOT_PASSWORD='<strong password>'
  existingSecret: ""

  # Escape hatch — pass at install time, never commit a value here:
  #   helm upgrade --install ... --set db.rootPassword="$DB_PASSWORD"
  # The chart then creates the Secret itself.
  rootPassword: ""

# =============================================================================
#  Pod security. Applied per component because the five images genuinely differ:
#  only two of them run as a non-root user, and only one needs a privileged port.
#  Verified against the running pods, not assumed:
#    app01   uid 999   (tomcat)      mc01  uid 11211 (memcache)
#    db01 / rmq01 / vproweb  run as root BY IMAGE DESIGN - their entrypoints
#    start privileged, then drop down themselves (gosu) or need port 80.
#
#  readOnlyRootFilesystem is NOT set yet: Tomcat writes to work/ and temp/,
#  nginx to /var/cache/nginx, MySQL to its datadir. That needs emptyDir volumes
#  per component and is a separate, riskier change.
# =============================================================================
security:
  # Applied to every container. Safe everywhere.
  common:
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

# Capabilities that must be ADDED BACK for the three root containers.
# Dropping ALL is correct for a container that simply runs as its final user,
# but these three start as root ON PURPOSE and then drop down themselves:
#   mysql / rabbitmq : entrypoint chowns the data dir, then `gosu <user>`
#   nginx            : master binds :80, then spawns workers as the nginx user
# A root process with an EMPTY capability set cannot call setuid() - it gets
# EPERM - so `drop: ALL` alone makes all three fail at startup.
capabilities:
  # chown the data dir, then switch user
  privilegeDropper: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
  # the same, plus binding a port below 1024
  webServer: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID", "NET_BIND_SERVICE"]

securityContext:
  # uid 999 - set explicitly because the image declares USER by NAME, and
  # runAsNonRoot cannot verify a named user: the kubelet refuses the pod with
  # "has runAsNonRoot and image has non-numeric user".
  app:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
  mc:
    runAsNonRoot: true
    runAsUser: 11211
    runAsGroup: 11211

# Velero backup hooks on db01. See the annotations in templates/10-db01.yaml
# for why a mysqldump is used rather than FLUSH TABLES WITH READ LOCK.
backup:
  hooks:
    enabled: true
    timeout: 5m

storage:
  className: gp3
  size: 8Gi

# PodDisruptionBudgets. See templates/70-pdb.yaml for the db01 trade-off -
# with one replica, minAvailable:1 means node drains BLOCK rather than take the
# database down unannounced. That is intended, but it is a choice.
podDisruptionBudgets:
  enabled: true
  app:
    minAvailable: 1      # 2 replicas -> one may be evicted at a time
  web:
    minAvailable: 1      # 2 replicas -> one may be evicted at a time
  database:
    enabled: true
    minAvailable: 1      # 1 replica  -> blocks voluntary eviction entirely

# NetworkPolicies. REQUIRES vpc-cni enableNetworkPolicy=true in terraform -
# without it these render, apply, and enforce nothing.
networkPolicies:
  enabled: true
  # The ALB reaches pods from its own ENIs, which are not pods, so ingress to
  # vproweb has to be expressed as an ipBlock. Must match terraform/vpc.tf.
  vpcCidr: 10.0.0.0/16

ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  # Tomcat sends 302 from / to /login, which an ALB health check reads as
  # unhealthy — so probe the page that actually returns 200.
  healthcheckPath: /login

app:
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits:   { memory: 1536Mi }

web:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }

database:
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { memory: 1Gi }

memcached:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 192Mi }

rabbitmq:
  # Credentials. Same pattern as the database: the value compiled into the WAR
  # is a placeholder, and the real one arrives as an environment variable that
  # Spring's PropertySourcesPlaceholderConfigurer resolves AHEAD of the
  # properties file. The image default guest/guest is publicly documented.
  existingSecret: ""   # preferred - must hold RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS
  username: ""         # only used when the chart creates the Secret itself
  password: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }
