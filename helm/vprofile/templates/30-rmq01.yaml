{{- include "vprofile.requireRmqSecret" . }}
{{- if not .Values.rabbitmq.existingSecret }}
# Only rendered when credentials came in via --set. With rabbitmq.existingSecret
# the chart touches no credential at all - the path Vault will take over.
apiVersion: v1
kind: Secret
metadata:
  name: rmq01-credentials
  labels: {{- include "vprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.password | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: rmq01
  labels: {{- include "vprofile.labels" . | nindent 4 }}
spec:
  selector:
    app: rmq01
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmq01
  labels: {{- include "vprofile.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmq01
  template:
    metadata:
      labels:
        app: rmq01
        {{- include "vprofile.labels" . | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ include "vprofile.image" (dict "root" . "name" "vprofile-rmq") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5672
          # The image default guest/guest is publicly documented, so the broker
          # is given real credentials from a Secret instead.
          envFrom:
            - secretRef:
                name: {{ include "vprofile.rmqSecretName" . }}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 8
          # Root by image design - the entrypoint drops privileges with gosu.
          securityContext:
            {{- include "vprofile.containerSecurity" (dict "root" . "extra" dict "add" .Values.capabilities.privilegeDropper) | nindent 12 }}
          resources: {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
